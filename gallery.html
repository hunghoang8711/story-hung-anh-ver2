<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131a">
<meta name="description" content="Album ảnh của Hùng × Ánh.">
<title>Album ảnh ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="gallery-page">
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">HUNG × ANH</p>
    <h1>Album ảnh <span style="color:var(--accent)">♥</span></h1>
    <p class="hero-sub">Tất cả những bức ảnh đã cùng nhau lưu lại trong những kỷ niệm.</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="index.html">← Dòng thời gian</a>
      <button class="btn btn-ghost" id="authBtn">Đăng nhập</button>
    </div>
  </div>
</header>
<main class="container">
  <section class="status-card">
    <div><strong id="photoCount">0</strong><span> bức ảnh</span></div>
    <div class="status-note" id="modeText">Đang kết nối…</div>
  </section>
  <section id="galleryGrid" class="gallery-grid" aria-live="polite"></section>
  <div id="galleryEmpty" class="gallery-empty" hidden>
    <div class="empty-heart">♡</div>
    <h2>Chưa có ảnh</h2>
    <p>Những bức ảnh trong các kỷ niệm sẽ xuất hiện ở đây.</p>
  </div>
</main>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Đóng">×</button>
  <img id="lightboxImage" alt="Ảnh kỷ niệm">
</div>
<dialog id="authDialog"><form method="dialog" class="modal" id="authForm">
<button type="button" class="modal-close" id="closeAuth">×</button>
<p class="eyebrow">PRIVATE STORY</p><h2>Tài khoản</h2>
<p class="muted">Đăng nhập để xem album ảnh riêng của hai người.</p>
<label>Email<input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required></label>
<label>Mật khẩu<input id="authPassword" type="password" minlength="6" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password" required></label>
<p id="authError" class="form-error"></p>
<button class="btn btn-primary full" type="submit">Đăng nhập</button>
<button class="btn btn-ghost full" type="button" id="signupBtn">Tạo tài khoản mới</button>
</form></dialog>
<script type="module" src="gallery.js"></script>
</body>
</html>
