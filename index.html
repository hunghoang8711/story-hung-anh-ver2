<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131a"><meta name="description" content="Our Story — nhật ký của hai người.">
<title>Hưng - Ánh Story❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261006-2">
</head>
<body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="hero"><div class="hero-inner">
<p class="eyebrow couple-name">Hưng × Ánh</p><h1>Our Story <span>♥</span></h1>
<p class="hero-sub">Những ngày bình thường trở thành những kỷ niệm đặc biệt.</p>
<div class="hero-actions"><button class="btn btn-primary" id="addStoryBtn">＋ Thêm kỷ niệm</button><a class="btn btn-ghost" href="gallery.html">📷 Album ảnh</a><button class="btn btn-ghost" id="authBtn">Đăng nhập</button></div>
</div></header>
<aside class="timeline-nav" id="timelineNav" aria-label="Điều hướng mốc thời gian"></aside>
<main class="container">
<section class="status-card"><div><strong id="storyCount">0</strong><span> kỷ niệm</span></div><div class="status-note" id="modeText">Đang kết nối…</div></section>
<section class="timeline" id="timeline" aria-live="polite"></section>
<div class="empty" id="emptyState"><div class="empty-heart">♡</div><h2>Chưa có kỷ niệm mới</h2><p>Hãy bắt đầu viết lại một ngày mà bạn muốn cả hai cùng nhớ.</p></div>
</main>
<dialog id="storyDetailDialog"><div class="detail-modal"><button type="button" class="modal-close" id="closeStoryDetail">×</button><div id="detailContent"></div></div></dialog>
<dialog id="storyDialog"><form method="post" id="storyForm" class="modal">
<button type="button" class="modal-close" id="closeDialog">×</button><p class="eyebrow" id="storyDialogEyebrow">NEW MEMORY</p><h2 id="storyDialogTitle">Thêm kỷ niệm</h2>
<label>Ngày<input id="storyDate" type="date" required></label>
<label>Tiêu đề<input id="storyTitle" maxlength="120" placeholder="Ví dụ: Một ngày thật vui" required></label>
<label>Nội dung<textarea id="storyContent" rows="7" maxlength="10000" placeholder="Viết điều bạn muốn lưu lại..." required></textarea></label>
<label>Ảnh kỷ niệm <span class="muted">(có thể chọn nhiều ảnh)</span><input id="storyImages" type="file" accept="image/*" multiple></label>
<div id="existingImages" class="image-preview existing-images" aria-live="polite"></div>
<div id="imagePreview" class="image-preview" aria-live="polite"></div>
<p id="storyFormError" class="form-error"></p>
<button class="btn btn-primary full" id="storySubmitBtn" type="submit">Lưu kỷ niệm ❤️</button>
</form></dialog>
<dialog id="authDialog"><form method="dialog" class="modal" id="authForm">
<button type="button" class="modal-close" id="closeAuth">×</button><p class="eyebrow">PRIVATE STORY</p><h2>Tài khoản</h2>
<p class="muted">Đăng nhập hoặc tạo tài khoản cho hai người.</p>
<label>Email<input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required></label>
<label>Mật khẩu<input id="authPassword" type="password" minlength="6" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password" required></label>
<p id="authError" class="form-error"></p>
<button class="btn btn-primary full" type="submit">Đăng nhập</button>
<button class="btn btn-ghost full" type="button" id="signupBtn">Tạo tài khoản mới</button>
</form></dialog>
<script type="module" src="app.js?v=20261006-3"></script>
</body></html>
